[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-mcp"
version = "0.1.0"
description = "MCP server for Google Analytics 4 (Data API + Admin API) — read-only tools, local stdio, Google OAuth browser sign-in"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Md. Mezbaul Hasan" }]
keywords = ["mcp", "google-analytics", "ga4", "model-context-protocol"]
dependencies = [
    "mcp[cli]>=2,<3",
    "httpx>=0.27,<1",
    "marketing-mcp-common>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
ga4-mcp = "ga4_mcp.cli:main"

# `uvx --from git+https://github.com/Mezbaul-Hasan/GA4-MCP-Server#subdirectory=servers/ga4-mcp ga4-mcp`
# resolves the shared package from the same checkout through this path source.
[tool.uv.sources]
marketing-mcp-common = { path = "../../common" }

[tool.setuptools.packages.find]
include = ["ga4_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
