[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-mcp-common"
version = "0.1.0"
description = "Shared helpers for the marketing MCP servers: Google OAuth (desktop flow), httpx client with retry/backoff, error mapping, log redaction, pagination/output budget, audit log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["marketing_mcp_common*"]

[tool.pytest.ini_options]
